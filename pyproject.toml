[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffcorr"
version = "0.4.5"
description = "Analyzing and visualizing differential correlation networks in biological data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Atsushi Fukushima", email = "afukushima@gmail.com" },
    { name = "Kozo Nishida", email = "kozo.nishida@gmail.com" },
]
keywords = ["bioinformatics", "differential correlation", "omics", "network", "metabolomics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "networkx>=2.6",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
test = ["pytest>=7.0", "matplotlib>=3.4"]

[project.urls]
Homepage = "https://github.com/afukushima/DiffCorr"
Repository = "https://github.com/afukushima/DiffCorr"

[tool.hatch.build.targets.wheel]
packages = ["src/diffcorr"]
artifacts = ["src/diffcorr/data/*.csv"]
